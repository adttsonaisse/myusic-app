[package]
name = "bitchord-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Linux native dual-deck audio engine (Symphonia + libopus + PipeWire + rtrb + Rubato), Float32 DSP chain, crossfade, skip-silence, time-stretch, SleepTimer, PartySync, and MPRIS2 D-Bus server"

[lints]
workspace = true

[features]
default = []
automix-onnx = ["bitchord-automix/automix-onnx"]

[dependencies]
alsa.workspace = true
audioadapter-buffers.workspace = true
bitchord-automix.workspace = true
bitchord-dsp-core.workspace = true
bitchord-innertube.workspace = true
bitchord-integrations.workspace = true
bitchord-jam.workspace = true
bitchord-model.workspace = true
libspa.workspace = true
lofty.workspace = true
mpris-server.workspace = true
pipewire = { workspace = true, features = ["v0_3_49"] }
reqwest.workspace = true
rtrb.workspace = true
rubato.workspace = true
serde.workspace = true
symphonia.workspace = true
symphonia-adapter-libopus.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
