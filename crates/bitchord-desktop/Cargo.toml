bitchord-dsp-core.workspace = true
bitchord-innertube.workspace = true
bitchord-integrations.workspace = true
bitchord-jam.workspace = true
bitchord-lyrics.workspace = true
bitchord-model.workspace = true
bitchord-netstorage.workspace = true
bitchord-queue.workspace = true
bitchord-storage.workspace = true
directories.workspace = true
gpui-ce.workspace = true
gpui-tray.workspace = true
gpui_ce_platform.workspace = true
gpui_ce_tokio.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
