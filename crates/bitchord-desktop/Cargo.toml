[package]
name = "bitchord-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Linux Desktop music player UI built with GPUI-CE (wgpu, Wayland/X11, PipeWire, MPRIS2, System Tray)"

[lints]
workspace = true

[features]
default = ["wayland", "x11", "ytdlp-bridge"]
wayland = ["gpui-ce/wayland", "gpui_ce_platform/wayland"]
x11 = ["gpui-ce/x11", "gpui_ce_platform/x11"]
ytdlp-bridge = ["bitchord-innertube/ytdlp-bridge"]

[dependencies]
