[workspace]
resolver = "3"
members = [
    "crates/bitchord-model",
    "crates/bitchord-jam",
    "crates/bitchord-dsp-core",
    "crates/bitchord-matcher",
    "crates/bitchord-queue",
    "crates/bitchord-lyrics",
    "crates/bitchord-innertube",
    "crates/bitchord-integrations",
    "crates/bitchord-storage",
    "crates/bitchord-netstorage",
    "crates/bitchord-automix",
    "crates/bitchord-audio",
    "crates/bitchord-cli",
    "crates/bitchord-desktop",
]
# Keep heavy GUI crates (added in Wave 4) out of default-members so core `cargo test`
# stays fast and low-RAM on Intel Core i3-1220P / 7.5 GiB RAM (ADR-007).
default-members = [
    "crates/bitchord-model",
    "crates/bitchord-jam",
    "crates/bitchord-dsp-core",
    "crates/bitchord-matcher",
    "crates/bitchord-queue",
    "crates/bitchord-lyrics",
    "crates/bitchord-innertube",
    "crates/bitchord-integrations",
    "crates/bitchord-storage",
    "crates/bitchord-netstorage",
    "crates/bitchord-automix",
    "crates/bitchord-audio",
    "crates/bitchord-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
alsa = "0.12"
async-channel = "2"
audioadapter-buffers = "5.2"
base64 = "0.23"
bitchord-audio = { path = "crates/bitchord-audio" }
bitchord-automix = { path = "crates/bitchord-automix" }
bitchord-dsp-core = { path = "crates/bitchord-dsp-core" }
bitchord-innertube = { path = "crates/bitchord-innertube" }
bitchord-integrations = { path = "crates/bitchord-integrations" }
bitchord-jam = { path = "crates/bitchord-jam" }
bitchord-lyrics = { path = "crates/bitchord-lyrics" }
bitchord-matcher = { path = "crates/bitchord-matcher" }
bitchord-model = { path = "crates/bitchord-model" }
bitchord-netstorage = { path = "crates/bitchord-netstorage" }
bitchord-queue = { path = "crates/bitchord-queue" }
bitchord-storage = { path = "crates/bitchord-storage" }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
futures-util = "0.3"
gpui-ce = { version = "0.3", default-features = false, features = ["font-kit", "image-default-formats"] }
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-ce"] }
gpui_ce_platform = { version = "0.3", default-features = false }
gpui_ce_tokio = "0.3"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libspa = { version = "0.10", features = ["v1_6_0"] }
lofty = "0.25"
md-5 = "0.10"
mpris-server = { version = "0.11", features = ["tokio"] }
oo7 = "0.7"
percent-encoding = "2"
pipewire = "0.10"
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
rquickjs = "0.14"
rtrb = "0.4"
rubato = "5.1"
rusqlite = "0.43"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
smb = { version = "0.12", default-features = false, features = ["sign", "encrypt", "async"] }
symphonia = { version = "0.6", default-features = false, features = [
    "opt-simd", "flac", "aac", "alac", "mp3", "vorbis", "pcm", "adpcm",
    "isomp4", "mkv", "ogg", "wav", "aiff", "all-meta",
] }
symphonia-adapter-libopus = { version = "0.3", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
unicode-normalization = "0.1"
unicode-script = "0.5"
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Laptop-friendly compilation profiles (ADR-007)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0
opt-level = 0

# Selective optimization for real-time audio decoders, resampler, and DSP so
# debug playback never suffers xruns on modest laptops (ADR-007).
[profile.dev.package.symphonia-codec-aac]
opt-level = 2
[profile.dev.package.symphonia-bundle-flac]
opt-level = 2
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 2
[profile.dev.package.symphonia-codec-alac]
opt-level = 2
[profile.dev.package.rubato]
opt-level = 2
[profile.dev.package.bitchord-dsp-core]
opt-level = 2

# Frame-critical UI layout/text/image decoding (gpui-ce/wgpu stays opt-level = 0 for RAM).
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.resvg]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 2
[profile.dev.package.parley]
opt-level = 2

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
