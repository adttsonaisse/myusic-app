[workspace]
resolver = "3"
members = [
    "crates/bitchord-model",
    "crates/bitchord-jam",
    "crates/bitchord-dsp-core",
    "crates/bitchord-matcher",
    "crates/bitchord-queue",
    "crates/bitchord-lyrics",
    "crates/bitchord-integrations",
]
# Keep heavy GUI crates (added in Wave 4) out of default-members so core `cargo test`
# stays fast and low-RAM on Intel Core i3-1220P / 7.5 GiB RAM (ADR-007).
default-members = [
    "crates/bitchord-model",
    "crates/bitchord-jam",
    "crates/bitchord-dsp-core",
    "crates/bitchord-matcher",
    "crates/bitchord-queue",
    "crates/bitchord-lyrics",
    "crates/bitchord-integrations",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.86"

[workspace.dependencies]
base64 = "0.23"
bitchord-model = { path = "crates/bitchord-model" }
flate2 = "1"
hmac = "0.12"
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
unicode-normalization = "0.1"
unicode-script = "0.5"
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Laptop-friendly compilation profiles (ADR-007)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
